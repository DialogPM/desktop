[package]
name = "chatapp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dialog — end-to-end encrypted messenger"

[lib]
name = "chatapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chat-core = { path = "../../crates/chat-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Signed auto-updates: the plugin is registered only when an updater public key and endpoint
# are set at build time (src/updater.rs, docs/DESKTOP-UPDATER.md).
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
rand = "0.9"
hex = "0.4"
mime_guess = "2"
# Notification / call sounds played natively (see src/sounds.rs).
rodio = { version = "0.22", default-features = false, features = ["playback"] }
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[features]
# Serve the bundled frontend (set automatically by `tauri build`).
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "linux")'.dependencies]
# Same version Tauri/wry use: enables microphone/camera capture in WebKitGTK.
webkit2gtk = "2.0"

# System idle time (presence, src/idle.rs). Linux has no portable source: always active there.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
user-idle = "0.6"

# Native notifications and the Dock badge permission (src/mac_notify.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
tokio = { version = "1", features = ["sync"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSUUID", "NSBundle"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter", "UNNotificationResponse"] }

[dev-dependencies]
tempfile = "3.27.0"
