name: Desktop builds

# Windows (MSI + NSIS installer), macOS (universal .app + .dmg) and Linux (.deb, .rpm, AppImage)
# installers of the Tauri app.
# The default server shown at login comes from the repository variable CHATAPP_DEFAULT_SERVER
# (Settings → Secrets and variables → Actions → Variables), or from the manual run's input.
# macOS: signed with the Developer ID certificate and notarized by Apple when the secrets
# APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_API_KEY, APPLE_API_ISSUER
# and APPLE_API_KEY_P8 (App Store Connect API key) are set; otherwise an ad-hoc signature.
# Windows and Linux builds are not code-signed.

on:
  workflow_dispatch:
    inputs:
      default_server:
        description: "Default server URL (empty: repository variable or the built-in placeholder)"
        required: false
        default: ""
  push:
    branches: ["claude/**", "main", "master"]
    # A version tag (v0.1.0, ...) also publishes the installers as a GitHub release (job
    # `release` below). Path filters do not apply to tags.
    tags: ["v*"]
    paths:
      - "app/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"

# Actions are pinned to commit SHAs where a verified pin was available offline (see ci.yml).

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: macos
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          # Ubuntu 22.04: the oldest supported glibc, so the packages run on more distributions.
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CHATAPP_DEFAULT_SERVER: ${{ inputs.default_server || vars.CHATAPP_DEFAULT_SERVER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libasound2-dev libssl-dev patchelf file
      # Same toolchain as ci.yml (docs/REPRODUCIBLE-BUILDS.md).
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.94.1 --profile minimal --target "${{ matrix.rust_targets }},wasm32-unknown-unknown"
          rustup default 1.94.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
      # libsignal generates code from .proto files.
      # TODO(supply-chain): pin to a commit SHA (no local copy of a pinned arduino/setup-protoc).
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Fails if Cargo.lock is not up to date, so the build below uses exactly the locked crates.
      - name: Fetch locked crates
        shell: bash
        run: cargo fetch --locked
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      # Developer ID signing + notarization (tauri build reads these variables), or ad-hoc.
      - name: macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CERT" ] && [ -n "$API_KEY_P8" ]; then
            printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Florentin Craciun (3A45UY6T3R)"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY=$API_KEY"
              echo "APPLE_API_ISSUER=$API_ISSUER"
            } >> "$GITHUB_ENV"
            echo "Developer ID signing and notarization enabled."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "No signing secrets: ad-hoc signature."
          fi
      # pwsh: on Windows, the OpenSSL build needs Strawberry Perl, not Git's perl from bash.
      - name: Build
        working-directory: app
        shell: pwsh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      # tauri notarizes the .app; the .dmg around it is notarized and stapled here, so Gatekeeper
      # also accepts the downloaded disk image.
      - name: Notarize the disk image
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        shell: bash
        run: |
          for dmg in target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-installers
          dir=target/${{ matrix.target }}/release/bundle
          find "$dir" -maxdepth 2 \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} dist-installers/ \;
          if [ -d "$dir/macos" ]; then
            (cd "$dir/macos" && ditto -c -k --keepParent Dialog.app "$GITHUB_WORKSPACE/dist-installers/Dialog-macos-universal.app.zip")
          fi
          ls -la dist-installers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Dialog-${{ matrix.name }}
          path: dist-installers/*
          if-no-files-found: error

  # Version tags only: the installers of both builds become a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} -R ${{ github.repository }} -D dist
          ls -laR dist
          if gh release view "${{ github.ref_name }}" -R ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" -R ${{ github.repository }} --clobber dist/*/*
          else
            gh release create "${{ github.ref_name }}" -R ${{ github.repository }} --title "Dialog ${{ github.ref_name }}" --generate-notes dist/*/*
          fi
