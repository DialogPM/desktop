# Snap of the desktop app for the Snap Store (https://snapcraft.io/dialog-pm). It repackages
# the .deb of a GitHub release (built on Ubuntu 22.04 by .github/workflows/desktop.yml), which
# .github/workflows/snap.yml downloads as dialog.deb next to this folder before the build.
name: dialog-pm
title: Dialog
adopt-info: dialog
summary: "Private messenger for Linux: no phone number, no email."
description: |
  Dialog brings encrypted chats to your Linux desktop without asking who you are. Sign-up
  takes a few seconds: you get a random account number, a password and a recovery phrase.
  No phone number, no email address, no contact book upload.

  Everything you send is encrypted on your computer before it leaves it. The server only
  relays sealed messages it cannot open, and deletes them once they are delivered.

  What you can do:

  * Chat one-to-one or in groups, with replies, reactions, mentions and edits
  * Make voice and video calls, including group calls
  * Send photos, files, voice notes and your location
  * Set messages to disappear after a timer, or send a photo that can be viewed only once
  * Find people by @username, or share your QR code
  * Use the same account on your phone and your computer, kept in sync
  * Keep several separate accounts on one computer, each locked with its own password
  * Add two-step verification and an app lock

  Built in the open: the desktop app, the mobile apps and the server are published under
  the AGPL-3.0 licence on GitHub. The default server runs in Germany, and you can point the
  app at your own server if you prefer to host it yourself.

  No ads, no trackers, no selling of data.

  Dialog also runs on Windows, macOS, Android and iPhone: https://dialog.pm
website: https://dialog.pm
contact: https://dialog.pm/#contact
source-code: https://github.com/DialogPM/desktop
issues: https://github.com/DialogPM/desktop/issues
license: AGPL-3.0-only
icon: snap/gui/dialog-pm.png
grade: stable
confinement: strict
base: core22
compression: lzo
architectures:
  - build-on: amd64

apps:
  dialog-pm:
    command: usr/bin/chatapp
    desktop: usr/share/applications/dialog-pm.desktop
    extensions: [gnome]
    plugs:
      - network
      - home
      - removable-media
      - audio-playback
      - audio-record
      - camera
      - opengl
    environment:
      ALSA_CONFIG_PATH: $SNAP/etc/asound.conf

# ALSA looks for its configuration and the PulseAudio plugin at fixed paths.
layout:
  /usr/lib/x86_64-linux-gnu/alsa-lib:
    bind: $SNAP/usr/lib/x86_64-linux-gnu/alsa-lib
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa

parts:
  dialog:
    plugin: dump
    source: dialog.deb
    source-type: deb
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libasound2
      - libasound2-plugins
    override-pull: |
      craftctl default
      craftctl set version="$(dpkg-deb -f "$CRAFT_PROJECT_DIR/dialog.deb" Version)"
    override-build: |
      craftctl default
      # The desktop entry under the snap's name, pointing at the icon inside the snap.
      APPS="$CRAFT_PART_INSTALL/usr/share/applications"
      mv "$APPS/Dialog.desktop" "$APPS/dialog-pm.desktop"
      sed -i -e 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/128x128/apps/chatapp.png|' \
             -e 's|^Exec=.*|Exec=dialog-pm %U|' \
             -e 's|^Categories=.*|Categories=Network;InstantMessaging;Chat;|' \
             "$APPS/dialog-pm.desktop"
      cat "$APPS/dialog-pm.desktop"

  alsa-config:
    plugin: dump
    source: snap/local
    organize:
      asound.conf: etc/asound.conf
    prime:
      - etc/asound.conf
